name: Network OS CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # validate:m7d includes M7-D -> M7-C -> M7-A -> M7-B -> M6-E -> M6-D -> M6-C -> M6-B -> M6-A -> M5 and the full prior regression chain
      - run: npm run validate:m7e
      - run: npm run check:types
      - run: npm run build
