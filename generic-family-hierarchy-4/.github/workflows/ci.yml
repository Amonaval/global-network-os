name: Network OS CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # validate:m6a includes validate:m5 and the full prior regression chain
      - run: npm run validate:m6a
      - run: npm run check:types
      - run: npm run build
